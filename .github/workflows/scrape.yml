name: Scrape FFVB Data

on:
  schedule:
    # Dimanche 21h30 UTC = 23h30 heure de Paris (UTC+2)
    - cron: '30 21 * * 0'
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/scrape_ffvb.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/poule_2mb.json
          git diff --staged --quiet || git commit -m "Update poule data $(date +%Y-%m-%d)"
          git push
